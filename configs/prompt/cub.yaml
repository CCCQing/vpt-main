RUN_N_TIMES: 1
DATA:
  NAME: "CUB"
  NUMBER_CLASSES: 200
  XLSA:
    PROTOCOL_MODE: "final_gzsl"      #dev / final_zsl / final_gzsl
MODEL:
  TYPE: "vit"
  CLASSIFIER: "vspcn_baseline"
  PROMPT:
    ENABLE: True
    BACKEND: "dynamic"             # dynamic / vpt_deep
    INIT_SOURCE: "distributor_mean"    # learned / distributor_mean
    DEEP: True
    NUM_TOKENS: 32
    DROPOUT: 0.0
    DISTRIBUTOR:
      ENABLE: True
      DISABLE_SAMPLING: True

  SEMANTIC_TOKENS:
    ENABLE: True
    NUM_TOKENS: 1
    INPUT_DIM: 312
    TRAIN_SOURCE: "learned_token"       # label / class_mean / none / random_fixed / label_shuffle / learned_token
    EVAL_SOURCE: "learned_token"         # label / class_mean / none / random_fixed / label_shuffle / learned_token
    RANDOM_SEED: 0
    RANDOM_STD: 1.0
    LEARNED_INIT_STD: 0.02
    BLOCK_S_TO_CLS: False

  AFFINITY:
    ENABLE: True
    DETACH: False

  R_SIMILARITY:
    ENABLE: True
    USE_COSINE: True
    LOGIT_SCALE_INIT: 10.0

  CONSISTENCY:
    ENABLE: False
    PROJ: "linear"
    DIST: "cosine"

SOLVER:
  BASE_LR: 0.0006
  WEIGHT_DECAY: 0.00001
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 30
  MAIN_LOSS: "vspcn"         # vspcn / rsim / rsim_v2
  LOSS_VSPCN_AR_WEIGHT: 0.0005
  LOSS_SEM_MED_WEIGHT: 0.0001
  LOSS_SPV_WEIGHT: 0.0
  SEM_MED:
    TARGET: "QpQv"           # QpKv / QpQv / KpKv
    METRIC: "kl"            # mse / kl / cosine
    NORM: "softmax"
    DETACH: "mediated"       # mediated / direct / none
    LAYERS: []
  SPV:
    COMPOSE: "prob"           # prob / raw_then_norm
    TARGET: "QpKv"           # QpKv / QpQv / KpKv
    METRIC: "kl"             # mse / kl / cosine
    NORM: "softmax"
    DETACH: "none"           # via_prompt / direct / none
    LAYERS: []
  LOSS_CM_WEIGHT: 0.05
  LOSS_CONS_WEIGHT: 0.00
  LOSS_ANCHOR_CONS_WEIGHT: 0.00
  LOSS_FREE_KD_WEIGHT: 0.0
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  BIAS_MULTIPLIER: 1.0
  VIS:
    ENABLE: True
    FINAL_ONLY: True
    EPOCH_LIST: []
    SPLITS: ["test_unseen"]
    MAX_SAMPLES: 4
    CORRECT_SAMPLES: 2
    WRONG_SAMPLES: 2
    ROLLOUT: True
    SEMANTIC_ABLATION:
      ENABLE: True
      DELTA_ASV: True
      ATTENTION_MASS: True
      DELTA_REFERENCE_SOURCE: "class_mean"
