RUN_N_TIMES: 1
DATA:
  NAME: "CUB"
  NUMBER_CLASSES: 200
  XLSA:
    PROTOCOL_MODE: "final_gzsl"      #dev / final_zsl / final_gzsl
MODEL:
  TYPE: "vit"
  CLASSIFIER: "vspcn_baseline"
  PROMPT:
    ENABLE: True
    BACKEND: "dynamic"             # dynamic / vpt_deep
    INIT_SOURCE: "distributor_mean"    # learned / distributor_mean
    DEEP: True
    NUM_TOKENS: 32
    DROPOUT: 0.0
    DISTRIBUTOR:
      ENABLE: True
      SOURCE: "token_mlp"
      STATS_HIDDEN_DIM: 8
      INSTANCE_TOKENS: 16
      DOMAIN_TOKENS: 16
      EVAL_SAMPLE_MODE: "mean"

  SEMANTIC_TOKENS:
    ENABLE: True
    NUM_TOKENS: 1
    INPUT_DIM: 312
    TRAIN_SOURCE: "class_mean"       # label / class_mean / none / random_fixed / label_shuffle / learned_token
    EVAL_SOURCE: "class_mean"         # label / class_mean / none / random_fixed / label_shuffle / learned_token
    RANDOM_SEED: 0
    RANDOM_STD: 1.0
    LEARNED_INIT_STD: 0.02
    BLOCK_S_TO_CLS: False

  AFFINITY:
    ENABLE: True
    DETACH: False

  AFFINITY_EVOLUTION:
    ENABLE: True
    PROMPT_ENABLE: True
    SEMANTIC_ENABLE: True
    PROMPT_TARGET: "QpQv"
    SEMANTIC_TARGET: "QpKv"
    PROMPT_LAMBDA: 0.0
    SEMANTIC_LAMBDA: 0.0
    PROMPT_GAMMA_INIT: 0.0
    SEMANTIC_GAMMA_INIT: 0.0
    PROMPT_DETACH: "mediated"
    SEMANTIC_DETACH: "direct"
    SEMANTIC_COMPOSE: "prob"

  ATTENTION_MEDIATION:
    # 新的 block 内 mediated attention correction 分支。
    # 开启时必须关闭 AFFINITY_EVOLUTION，避免层间 evolution 和层内 correction 混在一起。
    # 当前代码支持 attention_parallel/block_parallel、visual_block/full_row、row_preserve/block_redistribute。
    # block_parallel 需要 MLP_POLICY=enter_mlp；full_row 不能配合 block_redistribute。
    ENABLE: False
    SOURCE: "probs"                 # probs / scores
    EXECUTION_MODE: "attention_parallel"
    MLP_POLICY: "enter_mlp"         # enter_mlp / skip_mlp
    ROUTE_SCOPE: "visual_block"
    PROMPT_ROUTE: "S_to_P_and_V"    # S_to_P_and_V / P_to_S_to_V
    SEMANTIC_ROUTE: "S_to_P_to_V"   # S_to_P_to_V / P_to_S_and_V
    MASS_MODE: "row_preserve"
    BETA_PROMPT_MASS: 0.0
    BETA_SEMANTIC_MASS: 0.0
    PROMPT_GAMMA_INIT: 0.0
    SEMANTIC_GAMMA_INIT: 0.0

  R_SIMILARITY:
    ENABLE: True
    USE_COSINE: True
    LOGIT_SCALE_INIT: 10.0

  CONSISTENCY:
    ENABLE: False
    PROJ: "linear"
    DIST: "cosine"

SOLVER:
  BASE_LR: 0.0006
  WEIGHT_DECAY: 0.00001
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 30
  MAIN_LOSS: "vspcn"         # vspcn / rsim / rsim_v2
  LOSS_VSPCN_AR_WEIGHT: 0.0005
  LOSS_SEM_MED_WEIGHT: 0.0
  LOSS_SPV_WEIGHT: 0.0
  LOSS_ROUTE_TS_PROMPT_WEIGHT: 0.00005
  LOSS_ROUTE_TS_SEMANTIC_WEIGHT: 0.00005
  SEM_MED:
    TARGET: "QpQv"           # QpKv / QpQv / KpKv
    METRIC: "kl"            # mse / kl / cosine
    NORM: "softmax"
    DETACH: "mediated"       # mediated / direct / none
    LAYERS: []
  SPV:
    COMPOSE: "prob"           # prob / raw_then_norm
    TARGET: "QpKv"           # QpKv / QpQv / KpKv
    METRIC: "kl"             # mse / kl / cosine
    NORM: "softmax"
    DETACH: "none"           # mediated / direct / none
    LAYERS: []
  ROUTE_TS:
    PROMPT_ENABLE: True
    SEMANTIC_ENABLE: True
    METRIC: "kl"             # mse / kl / cosine
    LAYERS: []
  LOSS_CM_WEIGHT: 0.05
  LOSS_CONS_WEIGHT: 0.00
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  BIAS_MULTIPLIER: 1.0
  VIS:
    ENABLE: True
    FINAL_ONLY: True
    EPOCH_LIST: []
    SPLITS: ["test_unseen"]
    MAX_SAMPLES: 4
    CORRECT_SAMPLES: 2
    WRONG_SAMPLES: 2
    ROLLOUT: True
    SEMANTIC_ABLATION:
      ENABLE: True
      DELTA_ASV: True
      ATTENTION_MASS: True
      DELTA_REFERENCE_SOURCE: "class_mean"
