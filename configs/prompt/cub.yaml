# _BASE_: "../TEST/run_json_dataset_demo.yaml"
# Consolidated dataset/demo settings (migrated from TEST/run_json_dataset_demo.yaml)
#  DATA_ROOT: 'D:/postgraduate1/project/datasets/CUB/CUB_200_2011'
GZSL: true          # true -> include seen split when evaluating
MODE: xlsa          # "json" -> JSON annotations + dummy data
SKIP_DUMMY: false   # skip dummy data generation when using JSON mode
SPLIT: train        # "train" / "val" / "test"
USE_TRAINVAL: false # true -> TRAIN_USE_TRAINVAL = True -> trainval_loc

RUN_N_TIMES: 1
DATA:
  NAME: "CUB"
  # DATAPATH: "D:\\postgraduate1\\project\\datasets\\CUB\\CUB_200_2011"
  # XLSA_ROOT: 'D:/postgraduate1/project/datasets/xlsa17/xlsa17/data/CUB'
  NUMBER_CLASSES: 200
  MULTILABEL: False

MODEL:
  TYPE: "vit"
  PROMPT:
    NUM_TOKENS: 16
    DROPOUT: 0.0
    DISTRIBUTION_ONLY: True   # True -> 仅使用提示分布提供的 prompt，不创建静态可训练 prompt
    FREEZE_EMBEDDINGS: True
    DETACH_PROMPT_GRAD: True
    DISTRIBUTOR:
      ENABLE: True
      LATENT_DIM: 256
      HIDDEN_DIM: 512
      POOL: "gap"
      SEMANTIC_DIM: 312
      SEMANTIC_PROJ_DIM: 256

  SEMANTIC_BRANCH:
    USE_ANCHOR_FREE: True
    NUM_TOKENS: 6
    ANCHOR_TOKENS: 4
    FREE_TOKENS: 2
    FREE_COMPETE_LAMBDA: 0.5

  R_SIMILARITY:
    ENABLE: True
    USE_COSINE: True
    LOGIT_SCALE_INIT: 10.0

  SEMANTIC_SCORE_MODE: "global_raw"
  SEMANTIC_SCORE_SOURCE: "raw"
  SEMANTIC_SCORE_TRAIN_INCLUDE_GT: false
  SEMANTIC_SCORE_EVAL_OVERRIDE: "global_raw"

  AGR:
    TRAIN_INCLUDE_GT: false

SOLVER:
  EVAL_MODE: "gzsl"    # switch to "gzsl" (and/or set GZSL: true) for generalized ZSL
  BASE_LR: 0.0005           # 0.1
  WEIGHT_DECAY: 0.0001     # 0.01
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 1
  LOSS: "softmax_margin_cm"
  LOSS_CM_WEIGHT: 0.05
  LOSS_CONS_WEIGHT: 0.02
  LOSS_ANCHOR_CONS_WEIGHT: 0.02
  LOSS_FREE_KD_WEIGHT: 0.0
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  BIAS_MULTIPLIER: 1.0
  VIS:
    ENABLE: true
    EPOCH_LIST: [1, 3, 5, 7, 10, 15, 20, 30, 40, 50]
    SPLITS: ["val", "test"]
    MAX_SAMPLES: 8
    LOCAL_CONTROL: true
    ROLLOUT: true
    GT_HN_COMPARE: true
    TRENDS: true