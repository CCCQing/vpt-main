RUN_N_TIMES: 1
DATA:
  NAME: "CUB"
  NUMBER_CLASSES: 200
  XLSA:
    PROTOCOL_MODE: "dev"      #dev / final_zsl / final_gzsl
MODEL:
  TYPE: "vit"
  CLASSIFIER: "vspcn_baseline"
  PROMPT:
    ENABLE: False
    NUM_TOKENS: 16
    DROPOUT: 0.0

  SEMANTIC_BRANCH:
    ENABLE: False
    USE_ANCHOR_FREE: False
    ANCHOR_TOKENS: 4
    FREE_TOKENS: 2
    FREE_COMPETE_LAMBDA: 0.0

  R_SIMILARITY:
    ENABLE: True
    USE_COSINE: True
    LOGIT_SCALE_INIT: 10.0

  ROLE_MIGRATION:
    ENABLE: False
    EARLY_END: 3
    LATE_START: 9

  CONSISTENCY:
    ENABLE: False
    PROJ: "linear"
    DIST: "cosine"

SOLVER:
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0001
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 20
  LOSS: "vspcn_baseline"     # softmax_margin_cm   vspcn_baseline
  LOSS_MARGIN: 0.00
  LOSS_VSPCN_AR_WEIGHT: 0.0001
  LOSS_CM_WEIGHT: 0.05
  LOSS_CONS_WEIGHT: 0.00
  LOSS_ANCHOR_CONS_WEIGHT: 0.00
  LOSS_FREE_KD_WEIGHT: 0.0
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  BIAS_MULTIPLIER: 1.0
  VIS:
    ENABLE: False
    EPOCH_LIST: [1, 3, 5, 7, 10, 15, 20]
    SPLITS: ["test_seen", "test_unseen"]
    MAX_SAMPLES: 8
    LOCAL_CONTROL: true
    ROLLOUT: true
    GT_HN_COMPARE: true
    TRENDS: true
