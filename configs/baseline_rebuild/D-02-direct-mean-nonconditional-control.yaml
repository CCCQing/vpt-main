_BASE_: "D-01-direct-mean-residual.yaml"
OUTPUT_DIR: "output/baseline_rebuild/D-02-direct-mean-nonconditional-control"

# Parameter-matched nonconditional control.  It still executes the frozen ViT
# prepass and the same stats MLP, but replaces each image CLS with the same
# fixed unit-scale vector before the MLP.  It can learn a task-level constant
# delta, but cannot encode which image is being classified.
MODEL:
  PROMPT:
    DISTRIBUTOR:
      SOURCE: "vit_cls_prepass_constant"
      DEEP_RESIDUAL:
        ARCHITECTURE_ID: "D-direct-mean-nonconditional-control"

