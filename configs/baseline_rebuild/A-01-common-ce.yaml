NUM_GPUS: 1
NUM_SHARDS: 1
RUN_N_TIMES: 1
CUDNN_BENCHMARK: false
SEED: 0

DATA:
  NAME: "CUB"
  NUMBER_CLASSES: 200
  FEATURE: "sup_vitb16_224"
  CROPSIZE: 224
  BATCH_SIZE: 32
  NUM_WORKERS: 4
  PIN_MEMORY: true
  XLSA:
    ENABLED: true
    PROTOCOL_MODE: "final_gzsl"

MODEL:
  TYPE: "vit"
  CLASSIFIER: "vspcn_baseline"
  LOG_TRAINABLE: true
  PROMPT:
    ENABLE: false
    BACKEND: "dynamic"
    INIT_SOURCE: "learned"
    NUM_TOKENS: 5
    DEEP: false
    DROPOUT: 0.0
    DISTRIBUTOR:
      ENABLE: false
      FACTORIZED_ENABLE: false
  R_SIMILARITY:
    ENABLE: true
  SEMANTIC_TOKENS:
    ENABLE: false
  AFFINITY:
    ENABLE: false
    VIS: false
  ATTENTION_MEDIATION:
    ENABLE: false
  CONSISTENCY:
    ENABLE: false
  GRAPH_PROB_PRIOR:
    ENABLE: false
    LOSS_WEIGHT: 0.0

SOLVER:
  MAIN_LOSS: "vspcn"
  LOSS_VSPCN_AR_WEIGHT: 0.0
  LOSS_CM_WEIGHT: 0.0
  LOSS_SEM_MED_WEIGHT: 0.0
  LOSS_SPV_WEIGHT: 0.0
  LOSS_ATTR_WEIGHT: 0.0
  LOSS_PROMPT_KL_WEIGHT: 0.0
  LOSS_AGR_RES_WEIGHT: 0.0
  LOSS_CONS_WEIGHT: 0.0
  OPTIMIZER: "adamw"
  BASE_LR: 0.0006
  WEIGHT_DECAY: 0.00001
  SCHEDULER: "cosine"
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 30
  SAVE_TRAINABLE_FINAL_CHECKPOINT: true
  VIS:
    ENABLE: false

MONITOR:
  ENABLE: true
  OUTPUT_POLICY: "error_if_exists"
  NUMERICAL_GUARD:
    ENABLE: true
  OPTIMIZER_SANITY:
    ENABLE: true
  PREDICTION_HEALTH:
    ENABLE: true
  CLASS_ERROR:
    ENABLE: true
  CALIBRATION:
    ENABLE: true
  DIAGNOSTICS:
    ENABLE: true
    SAVE_EVAL_CACHE: true
  SEMANTIC_GRAPH_REFERENCE:
    ENABLE: true
  PROMPT_PARAMETER:
    ENABLE: true
  SEMANTIC_TOKEN:
    ENABLE: false
  AUXILIARY_LOSS:
    ENABLE: false
  PROBE:
    ENABLE: true
    FINAL_ONLY: true
    PER_CLASS: 2
    MAX_SAMPLES: 384
    ATTENTION_ENABLE: true
    AFFINITY_ENABLE: true
    FORWARD_EQUIVALENCE_ATOL: 1.0e-5
    FORWARD_EQUIVALENCE_MARGIN_ATOL: 1.0e-5
  MODULE_EFFECT:
    ENABLE: true
    PROMPT_ZERO: true
    ATTENTION_MEDIATION_GAMMA_ZERO: false
  PROMPT:
    ENABLE: false
  ATTENTION_MEDIATION:
    ENABLE: false
  AFFINITY:
    ENABLE: false
