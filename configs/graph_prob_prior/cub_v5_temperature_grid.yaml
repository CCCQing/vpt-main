BASE_CONFIG_FILE: "configs/prompt/cub.yaml"
DIAGNOSE_SCRIPT: "src/tools/diagnose_graph_prob_prior_temperatures.py"
PYTHON_BIN: ""
OUTPUT_DIR: "output/gpp_v6_parameter_search"
MAX_BATCHES: 111
NO_TRAIN_STEP: false

# 默认先只跑温度/核尺度搜索；非温度参数搜索用:
#   --stage other
# 如果明确想一次性展开两阶段，用:
#   --stage all
STAGE: "temperature"

EXTERNAL_GRAPH:
  PATH: "output/cub_attribute_localization/hparam_search_v5_seven_methods_nocap_gate/seven_method_matrices.npz"
  METHODS:
    - "method1_diff"
    - "method2_diff"
    - "method3_diff"
    - "llm_gate"
    - "method1_diff_llm_gate"
    - "method2_diff_llm_gate"
    - "method3_diff_llm_gate"

FIXED_OPTS:
  MODEL.SEMANTIC_GRAPH.ENABLE: false
  MODEL.SEMANTIC_GRAPH.GRAPH_SOURCE: "external"
  MODEL.SEMANTIC_GRAPH.LOSS_TYPE: "none"
  MODEL.SEMANTIC_GRAPH.LOSS_WEIGHT: 0.0
  MODEL.SEMANTIC_GRAPH.TOPK: 16
  MODEL.SEMANTIC_GRAPH.TARGET_MIX_ALPHA: 0.1
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_SYMMETRIZE: true
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_CLAMP: true
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_DIAG_VALUE: 1.0
  MODEL.GRAPH_PROB_PRIOR.ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: 0.001
  MODEL.GRAPH_PROB_PRIOR.REL_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.TAU_PRIOR: 0.07
  MODEL.GRAPH_PROB_PRIOR.MONITOR_ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.MONITOR_INACTIVE: false
  MODEL.GRAPH_PROB_PRIOR.MONITOR_TOPK: 5
  SOLVER.LOSS_PROMPT_KL_WEIGHT: 0.0
  SOLVER.LOSS_ROUTE_TS_PROMPT_WEIGHT: 0.0
  SOLVER.LOSS_ROUTE_TS_SEMANTIC_WEIGHT: 0.0
  SOLVER.VIS.ENABLE: false

MODE_SEARCH_SPACE:
  true_class_kl:
    # 旧结果: TAU_GRAPH=0.05 邻居过尖，0.20 过平；这里围绕 0.10 加密。
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12, 0.15]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
    OTHER_GRID:
      MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: [0.0005, 0.001, 0.002]

  graph_conditioned_semantic_prior:
    # 旧结果: TAU_LATENT=0.05/0.10 仍偏平，因此向更小温度扩展；TAU_ACC=0.10 优于 0.05，向 0.15 补一档。
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12]
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: [0.02, 0.05, 0.08]
      MODEL.SEMANTIC_GRAPH.TAU_ACC: [0.10, 0.15]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: 0.05
      MODEL.SEMANTIC_GRAPH.TAU_ACC: 0.10
    OTHER_GRID:
      MODEL.SEMANTIC_GRAPH.TARGET_MIX_ALPHA: [0.05, 0.10, 0.20]
      MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: [0.0005, 0.001, 0.002]

  class_aggregate_moment:
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12, 0.15]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
    OTHER_GRID:
      MODEL.GRAPH_PROB_PRIOR.MOMENT_VAR_WEIGHT: [0.25, 0.50, 1.0, 2.0]
      MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: [0.0005, 0.001]

  class_aggregate_mmd:
    # 旧结果: MMD_SIGMA=16 kernel 接近 0，64 偏高，32 附近最有信息量。
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12]
      MODEL.GRAPH_PROB_PRIOR.MMD_SIGMA: [24.0, 32.0, 48.0, 64.0]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
      MODEL.GRAPH_PROB_PRIOR.MMD_SIGMA: 32.0
    OTHER_GRID:
      MODEL.GRAPH_PROB_PRIOR.MMD_SAMPLES: [1, 2, 4]
      MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: [0.0005, 0.001]

  factorized_latent:
    FIXED_OPTS:
      MODEL.PROMPT.DISTRIBUTOR.FACTORIZED_ENABLE: true
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12]
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: [0.02, 0.05, 0.08]
      MODEL.SEMANTIC_GRAPH.TAU_ACC: [0.10, 0.15]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: 0.05
      MODEL.SEMANTIC_GRAPH.TAU_ACC: 0.10
    OTHER_GRID:
      MODEL.GRAPH_PROB_PRIOR.FACTORIZED_VARIATION_WEIGHT: [0.0, 0.01, 0.05]
      MODEL.GRAPH_PROB_PRIOR.FACTORIZED_DECOUPLE_WEIGHT: [0.0, 0.001, 0.005]

  dual_metric_semantic_distribution:
    FIXED_OPTS:
      MODEL.PROMPT.DISTRIBUTOR.FACTORIZED_ENABLE: true
      MODEL.GRAPH_PROB_PRIOR.DUAL_ALPHA_WEIGHT: 1.0
      MODEL.GRAPH_PROB_PRIOR.DUAL_BETA_LOWER_WEIGHT: 1.0
      MODEL.GRAPH_PROB_PRIOR.DUAL_BETA_UPPER_WEIGHT: 0.0
      MODEL.GRAPH_PROB_PRIOR.DUAL_NEG_TOPK: 16
      MODEL.GRAPH_PROB_PRIOR.DUAL_MARGIN_BASE: 1.0
      MODEL.GRAPH_PROB_PRIOR.DUAL_MARGIN_RISK_WEIGHT: 1.0
      MODEL.GRAPH_PROB_PRIOR.DUAL_PRIOR_VAR_MODE: "unit"
    TEMPERATURE_GRID:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08, 0.10, 0.12]
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: [0.02, 0.05, 0.08]
      MODEL.GRAPH_PROB_PRIOR.DUAL_TAU_NEG: [0.05, 0.08, 0.10]
    OTHER_FIXED_OPTS:
      MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
      MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: 0.05
      MODEL.GRAPH_PROB_PRIOR.DUAL_TAU_NEG: 0.08
    OTHER_GRID:
      MODEL.GRAPH_PROB_PRIOR.DUAL_NEG_TOPK: [8, 16, 32]
      MODEL.GRAPH_PROB_PRIOR.DUAL_MARGIN_BASE: [0.5, 1.0]
      MODEL.GRAPH_PROB_PRIOR.DUAL_BETA_LOWER_WEIGHT: [0.5, 1.0]
      MODEL.SEMANTIC_GRAPH.TARGET_MIX_ALPHA: [0.05, 0.10]
