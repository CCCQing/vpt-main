BASE_CONFIG_FILE: "configs/prompt/cub.yaml"
DIAGNOSE_SCRIPT: "src/tools/diagnose_graph_prob_prior_temperatures.py"
TRAIN_SCRIPT: "train.py"
RUNNER: "train"
PYTHON_BIN: ""
OUTPUT_DIR: "output/gpp_v8_learnable_stageA_prior_shape_30epoch_grid"

MAX_BATCHES: 1110
NO_TRAIN_STEP: false

STAGE: "stagea_soft_distribution_matching"
STAGE_ORDER:
  - "stagea_soft_distribution_matching"
  - "stagea_graph_ordinal_ranking"

EXTERNAL_GRAPH:
  PATH: "cub_attribute_localization/05_hparam_searches/diff_only_graphs_v1/diff_only_method_matrices_v1.npz"
  METHODS:
    - "method1_diff"
    - "method2_diff"
    - "method3_diff"

FIXED_OPTS:
  RUN_N_TIMES: 2
  DATA.BATCH_SIZE: 32
  SOLVER.BASE_LR: 0.0006
  SOLVER.TOTAL_EPOCH: 30
  SOLVER.WARMUP_EPOCH: 3
  SOLVER.LOSS_PROMPT_KL_WEIGHT: 0.0
  SOLVER.LOSS_ROUTE_TS_PROMPT_WEIGHT: 0.0
  SOLVER.LOSS_ROUTE_TS_SEMANTIC_WEIGHT: 0.0
  SOLVER.VIS.ENABLE: false
  SOLVER.VIS.SAVE_RAW: false
  SOLVER.VIS.SAVE_IMAGES: false
  SOLVER.VIS.ROLLOUT: false

  MODEL.PROMPT.DISTRIBUTOR.FACTORIZED_ENABLE: false
  MODEL.SEMANTIC_GRAPH.ENABLE: false
  MODEL.SEMANTIC_GRAPH.GRAPH_SOURCE: "external"
  MODEL.SEMANTIC_GRAPH.LOSS_TYPE: "none"
  MODEL.SEMANTIC_GRAPH.LOSS_WEIGHT: 0.0
  MODEL.SEMANTIC_GRAPH.TOPK: 16
  MODEL.SEMANTIC_GRAPH.TAU_ACC: 0.10
  MODEL.SEMANTIC_GRAPH.TARGET_MIX_ALPHA: 0.10
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_SYMMETRIZE: true
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_CLAMP: true
  MODEL.SEMANTIC_GRAPH.EXTERNAL_GRAPH_DIAG_VALUE: 1.0

  MODEL.GRAPH_PROB_PRIOR.ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.MODE: "graph_conditioned_semantic_prior"
  MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: 0.001
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MEAN_MODE: "residual_anchor"
  MODEL.GRAPH_PROB_PRIOR.PRIOR_VAR_MODE: "unit"
  MODEL.GRAPH_PROB_PRIOR.PRIOR_LOGVAR_CONST: 0.0
  MODEL.GRAPH_PROB_PRIOR.RESIDUAL_SIGMA_MIN: 0.05
  MODEL.GRAPH_PROB_PRIOR.RESIDUAL_CLIP: 3.0
  MODEL.GRAPH_PROB_PRIOR.PRIOR_RADIUS_MODE: "residual_norm"
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE: 2.5
  MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE: 0.15
  MODEL.GRAPH_PROB_PRIOR.LEARN_PRIOR_MU_SCALE: true
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE_MIN: 0.5
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE_MAX: 5.0
  MODEL.GRAPH_PROB_PRIOR.LEARN_PRIOR_DELTA_SCALE: true
  MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE_MIN: 0.0
  MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE_MAX: 0.8
  MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
  MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: 0.05
  MODEL.GRAPH_PROB_PRIOR.REL_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.TAU_PRIOR: 0.07
  MODEL.GRAPH_PROB_PRIOR.MMD_SAMPLES: 1
  MODEL.GRAPH_PROB_PRIOR.MMD_SIGMA: 32.0
  MODEL.GRAPH_PROB_PRIOR.FACTORIZED_VARIATION_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.FACTORIZED_DECOUPLE_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.GEOM_TOPK: 8
  MODEL.GRAPH_PROB_PRIOR.GEOM_SIGMA_PRIOR: 0.2
  MODEL.GRAPH_PROB_PRIOR.GEOM_DETACH_RADIUS: true
  MODEL.GRAPH_PROB_PRIOR.GEOM_TAU_BARRIER: 0.10
  MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_EPS: 1e-8
  MODEL.GRAPH_PROB_PRIOR.MONITOR_ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.MONITOR_INACTIVE: false
  MODEL.GRAPH_PROB_PRIOR.MONITOR_EVERY_N: 37
  MODEL.GRAPH_PROB_PRIOR.MONITOR_TOPK: 5

MODE_SEARCH_SPACE:
  graph_conditioned_semantic_prior:
    STAGES:
      stagea_soft_distribution_matching:
        FIXED_OPTS:
          MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_TYPE: "soft_distribution_matching"
          MODEL.GRAPH_PROB_PRIOR.GEOM_TAU_GRAPH_DIST: 0.10
          MODEL.GRAPH_PROB_PRIOR.GEOM_TAU_DIST: 0.05
          MODEL.GRAPH_PROB_PRIOR.GEOM_BOUND_WEIGHT: 0.10
          MODEL.GRAPH_PROB_PRIOR.GEOM_MARGIN_MIN: 0.10
        GRAPH_METHODS:
          method1_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0005
          method2_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0003
          method3_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0003

      stagea_graph_ordinal_ranking:
        FIXED_OPTS:
          MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_TYPE: "graph_ordinal_ranking"
          MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_MARGIN_BASE: 0.00
          MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_GRAPH_GAP_EPS: 0.000001
          MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_WEIGHT_BY_GAP: true
          MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_NON_OVERLAP_MIN_DIST: 0.05
          MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_NON_OVERLAP_SCOPE: "topk"
        GRAPH_METHODS:
          method1_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0001
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_DISTANCE_TYPE: "euclidean"
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_MARGIN_SCALE: 0.10
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_NON_OVERLAP_WEIGHT: 0.01
          method2_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0001
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_DISTANCE_TYPE: "clearance"
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_MARGIN_SCALE: 0.20
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_NON_OVERLAP_WEIGHT: 0.01
          method3_diff:
            FIXED_OPTS:
              MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0003
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_DISTANCE_TYPE: "clearance"
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_MARGIN_SCALE: 0.20
              MODEL.GRAPH_PROB_PRIOR.GEOM_ORD_NON_OVERLAP_WEIGHT: 0.00

