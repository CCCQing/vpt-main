BASE_CONFIG_FILE: "configs/prompt/cub.yaml"
DIAGNOSE_SCRIPT: "src/tools/historical_files/graph_prob_prior_diagnostics/diagnose_graph_prob_prior_temperatures.py"
TRAIN_SCRIPT: "train.py"
RUNNER: "train"
PYTHON_BIN: ""
OUTPUT_DIR: "output/gpp_v6_residual_norm_method1_stage2_prior_shape_grid"

# Stage2 只验证 residual_norm + method1_diff 下的 prior shape。
# 三条 base 线来自 residual_norm-test1 中 method1_diff 的 stage0/stage1 最优温度点：
#   1. factorized_latent: H=53.07, TAU_GRAPH=0.08, TAU_LATENT=0.03, TAU_ACC=0.10
#   2. graph_conditioned_semantic_prior: H=52.71, TAU_GRAPH=0.08, TAU_LATENT=0.05, TAU_ACC=0.12
#   3. class_aggregate_mmd: H=49.61, TAU_GRAPH=0.12, MMD_SIGMA=32
# 每条 base 搜索 3 个 PRIOR_MU_SCALE × 4 个 PRIOR_DELTA_SCALE，共 36 组。
MAX_BATCHES: 1110
NO_TRAIN_STEP: false

STAGE: "stage2_prior_shape_method1"
STAGE_ORDER:
  - "stage2_prior_shape_method1"

EXTERNAL_GRAPH:
  PATH: "cub_attribute_localization/05_hparam_searches/diff_only_graphs_v1/diff_only_method_matrices_v1.npz"
  METHODS:
    - "method1_diff"

FIXED_OPTS:
  RUN_N_TIMES: 1
  DATA.BATCH_SIZE: 64
  SOLVER.BASE_LR: 0.00125
  SOLVER.TOTAL_EPOCH: 10
  SOLVER.WARMUP_EPOCH: 1
  SOLVER.LOG_EVERY_N: 37
  SOLVER.LOSS_PROMPT_KL_WEIGHT: 0.0
  SOLVER.VIS.ENABLE: false
  SOLVER.VIS.SAVE_RAW: false
  SOLVER.VIS.SAVE_IMAGES: false
  SOLVER.VIS.ROLLOUT: false

  MODEL.PROMPT.DISTRIBUTOR.FACTORIZED_ENABLE: false
  MODEL.GRAPH_INPUT.TOPK: 16
  MODEL.GRAPH_INPUT.TAU_ACC: 0.10
  MODEL.GRAPH_INPUT.TARGET_MIX_ALPHA: 0.10
  MODEL.GRAPH_INPUT.EXTERNAL_GRAPH_SYMMETRIZE: true
  MODEL.GRAPH_INPUT.EXTERNAL_GRAPH_CLAMP: true
  MODEL.GRAPH_INPUT.EXTERNAL_GRAPH_DIAG_VALUE: 1.0

  MODEL.GRAPH_PROB_PRIOR.ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.LOSS_WEIGHT: 0.001
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MEAN_MODE: "residual_anchor"
  MODEL.GRAPH_PROB_PRIOR.PRIOR_VAR_MODE: "unit"
  MODEL.GRAPH_PROB_PRIOR.PRIOR_LOGVAR_CONST: 0.0
  MODEL.GRAPH_PROB_PRIOR.RESIDUAL_SIGMA_MIN: 0.05
  MODEL.GRAPH_PROB_PRIOR.RESIDUAL_CLIP: 3.0
  MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE: 2.0
  MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE: 0.10
  MODEL.GRAPH_PROB_PRIOR.PRIOR_RADIUS_MODE: "residual_norm"
  MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: 0.10
  MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: 0.05
  MODEL.GRAPH_PROB_PRIOR.REL_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.TAU_PRIOR: 0.07
  MODEL.GRAPH_PROB_PRIOR.MMD_SAMPLES: 1
  MODEL.GRAPH_PROB_PRIOR.MMD_SIGMA: 32.0
  MODEL.GRAPH_PROB_PRIOR.FACTORIZED_VARIATION_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.FACTORIZED_DECOUPLE_WEIGHT: 0.0
  MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_ENABLE: false
  MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_TYPE: "soft_distribution_matching"
  MODEL.GRAPH_PROB_PRIOR.GEOM_LOSS_WEIGHT: 0.0001
  MODEL.GRAPH_PROB_PRIOR.GEOM_TOPK: 5
  MODEL.GRAPH_PROB_PRIOR.GEOM_SIGMA_PRIOR: 0.2
  MODEL.GRAPH_PROB_PRIOR.GEOM_TAU_GRAPH_DIST: 0.10
  MODEL.GRAPH_PROB_PRIOR.GEOM_TAU_DIST: 0.10
  MODEL.GRAPH_PROB_PRIOR.GEOM_BOUND_WEIGHT: 0.10
  MODEL.GRAPH_PROB_PRIOR.MONITOR_ENABLE: true
  MODEL.GRAPH_PROB_PRIOR.MONITOR_INACTIVE: true
  MODEL.GRAPH_PROB_PRIOR.MONITOR_EVERY_N: 37
  MODEL.GRAPH_PROB_PRIOR.MONITOR_TOPK: 5

MODE_SEARCH_SPACE:
  graph_conditioned_semantic_prior:
    STAGES:
      stage2_prior_shape_method1:
        GRAPH_METHODS:
          method1_diff:
            GRID:
              MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08]
              MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: [0.05]
              MODEL.GRAPH_INPUT.TAU_ACC: [0.12]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE: [1.5, 2.0, 2.5]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE: [0.0, 0.05, 0.10, 0.15]

  class_aggregate_mmd:
    STAGES:
      stage2_prior_shape_method1:
        GRAPH_METHODS:
          method1_diff:
            GRID:
              MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.12]
              MODEL.GRAPH_PROB_PRIOR.MMD_SIGMA: [32.0]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE: [1.5, 2.0, 2.5]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE: [0.0, 0.05, 0.10, 0.15]

  factorized_latent:
    FIXED_OPTS:
      MODEL.PROMPT.DISTRIBUTOR.FACTORIZED_ENABLE: true
    STAGES:
      stage2_prior_shape_method1:
        GRAPH_METHODS:
          method1_diff:
            GRID:
              MODEL.GRAPH_PROB_PRIOR.TAU_GRAPH: [0.08]
              MODEL.GRAPH_PROB_PRIOR.TAU_LATENT: [0.03]
              MODEL.GRAPH_INPUT.TAU_ACC: [0.10]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_MU_SCALE: [1.5, 2.0, 2.5]
              MODEL.GRAPH_PROB_PRIOR.PRIOR_DELTA_SCALE: [0.0, 0.05, 0.10, 0.15]
