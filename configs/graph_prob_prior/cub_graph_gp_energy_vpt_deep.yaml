NUM_GPUS: 1
NUM_SHARDS: 1
RUN_N_TIMES: 1
CUDNN_BENCHMARK: false
SEED: 0

DATA:
  NAME: "CUB"
  NUMBER_CLASSES: 200
  FEATURE: "sup_vitb16_224"
  CROPSIZE: 224
  BATCH_SIZE: 32
  NUM_WORKERS: 4
  PIN_MEMORY: true
  XLSA:
    ENABLED: true
    PROTOCOL_MODE: "final_gzsl"

MODEL:
  TYPE: "vit"
  CLASSIFIER: "r_similarity"
  PROMPT:
    ENABLE: true
    BACKEND: "vpt_deep"
    INIT_SOURCE: "distributor_mean"
    DEEP: true
    NUM_TOKENS: 32
    DROPOUT: 0.0
    DISTRIBUTOR:
      ENABLE: true
      SOURCE: "token_mlp"
      STATS_HIDDEN_DIM: 64
      INSTANCE_TOKENS: 16
      DOMAIN_TOKENS: 16
      OUTPUT_PARAM: "logvar"
      LOGVAR_MIN: -10.0
      LOGVAR_MAX: 5.0
      EVAL_SAMPLE_MODE: "fixed_eps"
      FIXED_EPS_SEED: 0
      USE_SLOT_EMBED: true
  R_SIMILARITY:
    SCORE_MODE: "dot"
    LEARNABLE_SCALE: false
  SEMANTIC_TOKENS:
    ENABLE: false
  AFFINITY:
    ENABLE: false
    DETACH: false
    VIS: false
  ATTENTION_MEDIATION:
    ENABLE: false
  GRAPH_INPUT:
    GRAPH_SOURCE: "method1_diff"
    EXTERNAL_GRAPH_PATH: "cub_attribute_localization/05_hparam_searches/diff_only_graphs_v1/diff_only_method_matrices_v1.npz"
    EXTERNAL_GRAPH_SYMMETRIZE: true
    EXTERNAL_GRAPH_CLAMP: true
    EXTERNAL_GRAPH_DIAG_VALUE: 1.0
    NUM_CLASSES: 200
    ATTR_DIM: 312
    TEXT_DIM: 768
    EPS: 1.0e-8
  GRAPH_PROB_PRIOR:
    ENABLE: true
    LOSS_WEIGHT: 0.001
    PRIOR_LOGVAR_CONST: 0.0
    GRAPH_GP_CENTER_SOURCE: "posterior_mu"
    GRAPH_GP_DETACH_CENTERS: true
    GRAPH_GP_OBS_NOISE_MODE: "class_var_over_count"
    GRAPH_GP_OBS_NOISE_CONST: 0.05
    GRAPH_GP_OBS_NOISE_MIN: 1.0e-4
    GRAPH_GP_OBS_NOISE_MAX: 1.0
    GRAPH_GP_RIDGE: 1.0e-4
    GRAPH_GP_KERNEL_SYMMETRIZE: true
    GRAPH_GP_KERNEL_CLAMP: true
    GRAPH_GP_KERNEL_NORMALIZE: "diag"
    GRAPH_GP_PRIOR_VAR_SOURCE: "unit"
    GRAPH_GP_PRIOR_VAR_FLOOR: 0.05
    GRAPH_GP_PRIOR_VAR_PROTO_WEIGHT: 1.0
    GRAPH_GP_PRIOR_VAR_VISUAL_WEIGHT: 1.0
    GRAPH_GP_PRIOR_VAR_MIN: 1.0e-4
    GRAPH_GP_PRIOR_VAR_MAX: 10.0
    GRAPH_GP_MATCH_DETACH_PRIOR: true
    GRAPH_GP_OBJECTIVE: "energy_classification"
    GRAPH_GP_ENERGY_TAU: 1.0
    GRAPH_GP_ENERGY_CLASS_SPACE: "seen"
    MONITOR_ENABLE: true
    MONITOR_TOPK: 5
    MONITOR_EVERY_N: 37
    MONITOR_EFFECTIVE_RANK: false

SOLVER:
  RSIM:
    ALIGN_MODE: "ar"
    ALIGN_WEIGHT: 0.0005
  LOSS_PROMPT_KL_WEIGHT: 0.0
  LOSS_ATTR_WEIGHT: 0.0
  LOSS_SEM_MED_WEIGHT: 0.0
  LOSS_SPV_WEIGHT: 0.0
  OPTIMIZER: "adamw"
  BASE_LR: 0.0006
  WEIGHT_DECAY: 0.00001
  SCHEDULER: "cosine"
  WARMUP_EPOCH: 3
  TOTAL_EPOCH: 30
  VIS:
    ENABLE: false

MONITOR:
  ENABLE: true
